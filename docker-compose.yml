services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagina-tincho-app
    init: true
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      # SvelteKit puede bloquear envíos de formularios por protección CSRF. 
      # IMPORTANTE: Cambia esto a tu dominio real (incluyendo https://)
      - ORIGIN=https://nehemi.online
      # Dile a SvelteKit que lea el protocolo real que le pasa Cloudflare (HTTPS)
      - PROTOCOL_HEADER=x-forwarded-proto
      # Dile a SvelteKit de qué cabecera leer la IP real (necesario para el rate limit detrás de Cloudflare)
      - ADDRESS_HEADER=CF-Connecting-IP
    # Seguridad: Evita que el contenedor o sus hijos obtengan nuevos privilegios
    security_opt:
      - no-new-privileges:true
    # Quita todas las capacidades extra de root en Linux (tu app no las necesita)
    cap_drop:
      - ALL
    # Fuerza la ejecución como usuario sin privilegios (UID 1000)
    user: "1001:1001"
    volumes:
      # Persistencia para la base de datos (LowDB) y las imágenes subidas
      - ./data:/app/data
      - ./static/images:/app/static/images
      - ./static/images:/app/build/client/images
