services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagina-tincho-app
    init: true
    restart: unless-stopped
    # Ya no exponemos puertos. Cloudflare se comunicará internamente por la red de Docker.
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      # SvelteKit puede bloquear envíos de formularios por protección CSRF. 
      # Configura esto con la URL exacta desde donde pruebas (ej. http://localhost:3000 en local o tu dominio en prod)
      - ORIGIN=https://martinmangudo.duckdns.org
      # Dile a SvelteKit que lea el protocolo real que le pasa Nginx (HTTPS)
      - PROTOCOL_HEADER=x-forwarded-proto
      # Configuración de Google Cloud Storage
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY}
      # Opcional: URL de Cloudflare u otro CDN para servir las imágenes
      - CDN_PUBLIC_URL=${CDN_PUBLIC_URL}
    # Seguridad: Evita que el contenedor o sus hijos obtengan nuevos privilegios
    security_opt:
      - no-new-privileges:true
    # Quita todas las capacidades extra de root en Linux (tu app no las necesita)
    cap_drop:
      - ALL
    # Fuerza la ejecución como usuario sin privilegios (UID 1000)
    user: "1000:1000"
    volumes:
      # Persistencia para la base de datos (LowDB) y las imágenes subidas
      - ./data:/app/data

  # Túnel de Cloudflare que reemplaza a Nginx
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}