<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Lato:wght@100;300;400;700&family=Roboto:wght@100;300;400;500;700&display=swap">
		<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lato:wght@100;300;400;700&family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
		<noscript>
			<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lato:wght@100;300;400;700&family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
		</noscript>

		<!-- Open Graph / Facebook / WhatsApp -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://martin.nehemi.online/" />
		<meta property="og:title" content="Martín Mangudo | Fotografía Profesional" />
		<meta property="og:description" content="Capturando la esencia de cada detalle. Fotografía Profesional & Creación de Contenido." />
		<meta property="og:image" content="https://martin.nehemi.online/images/graph.png" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://martin.nehemi.online/" />
		<meta name="twitter:title" content="Martín Mangudo | Fotografía Profesional" />
		<meta name="twitter:description" content="Capturando la esencia de cada detalle. Fotografía Profesional & Creación de Contenido." />
		<meta name="twitter:image" content="https://martin.nehemi.online/images/graph.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
